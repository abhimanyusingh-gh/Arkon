name: Validate skill

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill package
        run: python3 -B scripts/validate_skill.py
      - name: Exercise history inventory against temporary repositories
        run: python3 -B -m unittest discover -s tests -v
      - name: Check patch whitespace
        env:
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$VALIDATION_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            VALIDATION_BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$VALIDATION_BASE_SHA" HEAD
