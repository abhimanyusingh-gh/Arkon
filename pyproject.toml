[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arkon-discover"
version = "1.3.0"
description = "Detect a repository's build system, framework, data stack and conventions, and write them as JSON with a confidence level per field."
readme = "packaging/README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "abhimanyusingh-gh"}]
keywords = ["project-context", "conventions", "code-assistant", "static-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/abhimanyusingh-gh/Arkon"
Documentation = "https://github.com/abhimanyusingh-gh/Arkon/blob/main/skills/craft/references/project-binding.md"

[project.scripts]
arkon-discover = "discover_project_context:main"

# One source of truth: the module is the craft skill's own script, not a copy.
[tool.setuptools]
package-dir = {"" = "skills/craft/scripts"}
py-modules = ["discover_project_context"]
